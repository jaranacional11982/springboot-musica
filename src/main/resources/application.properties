# ==========================================
# 1. CONFIGURACIÓN DE MYSQL (Con Variables de Entorno)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/musicadb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea y actualiza las tablas automáticamente en MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# 2. CONFIGURACIÓN DE OBSERVABILIDAD (Actuator y Prometheus)
# ==========================================
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true